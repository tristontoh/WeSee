# ── Server ────────────────────────────────────────────────
server.port=8000

# Loads application-local.properties (gitignored) for real secrets like the DB password.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Database (native JDBC form) ───────────────────────────
# The real password is NOT committed — set it in application-local.properties (gitignored)
# or via the DB_PASSWORD env var. The default below is just a safe placeholder.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wesee}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Java owns the schema: Hibernate creates/updates the tables, a seeder fills demo data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# All JSON is snake_case to match the Angular frontend (total_tco2e, access_token, org_type…).
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── Auth ──────────────────────────────────────────────────
wesee.jwt-secret=${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum!!}
wesee.jwt-ttl-minutes=60

# ── BYO-Token / Gemini (Engine 01 bill parsing) ──────────
# Drop your Google AI Studio key here to parse REAL bills; blank = built-in mock extractor.
wesee.gemini-api-key=${GEMINI_API_KEY:}
wesee.gemini-model=${GEMINI_MODEL:gemini-2.0-flash}

# ── CORS ──────────────────────────────────────────────────
wesee.cors-origin=${CORS_ORIGIN:http://localhost:4210}
