spring:
  datasource:
    url: jdbc:h2:mem:wesee_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration

wesee:
  extraction:
    # Pinned, not inherited: no test may reach a model, and none needs a key to run.
    provider: stub
