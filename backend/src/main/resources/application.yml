spring:
  application:
    name: esg-backend
  profiles:
    # local last so it wins: it holds credentials that must not be committed, and Spring
    # tolerates the file being absent — a fresh clone starts without one.
    active: dev,local
  # Production configuration. Every profile that needs different values overrides these, so
  # what is written here is what a deploy with no profile gets — which is what DEPLOYING.md
  # calls production.
  #
  # No defaults on the four that identify the database. A default here would let a deploy with a
  # missing variable start anyway and connect somewhere unintended; without one it stops at
  # startup naming the variable. The dev, docker and test profiles each supply their own, so this
  # strictness never reaches a developer's machine.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Checks every entity against the schema Flyway just produced and refuses to start if they
      # disagree. This lived only in the dev, docker and test profiles until 2026-10-11, so a
      # production start did no validation at all and a mismatched column failed at the first
      # query that touched it instead of at boot.
      ddl-auto: validate
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # prometheus is NOT permitAll in SecurityConfig — it names every route and its traffic,
        # which is a map for anyone probing. Scrape it with credentials or from inside the network.
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wesee:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890-abcdef}
    expiration-minutes: 1440
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4210}
  metrics:
    # The bearer token Prometheus presents to /actuator/prometheus. Empty means those endpoints
    # refuse everything — see MetricsAccessGuard. Generate one with: openssl rand -hex 32
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  uploads:
    dir: ${UPLOADS_DIR:./data/uploads}
  extraction:
    gemini:
      # Empty means the real Google endpoint. Set it only to route through a proxy or a regional
      # endpoint. There is no fixed-reading fallback: without a key, startup stops.
      base-url: ${GEMINI_BASE_URL:}
      # Never a literal here — this file is committed and the repo is public. Set GEMINI_API_KEY,
      # or put the key in the gitignored application-local.properties.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}
  mail:
    from: ${MAIL_FROM:no-reply@wesee.my}
  app:
    base-url: ${APP_BASE_URL:http://localhost:4210}
