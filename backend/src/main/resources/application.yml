spring:
  application:
    name: esg-backend
  profiles:
    # local last so it wins: it holds credentials that must not be committed, and Spring
    # tolerates the file being absent — a fresh clone starts without one.
    active: dev,local
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wesee:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890-abcdef}
    expiration-minutes: 1440
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4210}
  auth:
    throttle:
      # Per address, per window, on the endpoints that need no token. Counted in one process's
      # memory, so behind more than one instance the effective limit multiplies — the per-account
      # lock in LoginAttemptService is what does not care how many instances there are.
      enabled: ${AUTH_THROTTLE_ENABLED:true}
      login-per-window: ${AUTH_THROTTLE_LOGIN:10}
      signup-per-window: ${AUTH_THROTTLE_SIGNUP:5}
      window-minutes: ${AUTH_THROTTLE_WINDOW_MINUTES:5}
  uploads:
    dir: ${UPLOADS_DIR:./data/uploads}
  extraction:
    gemini:
      # Empty means the real Google endpoint. Set it only to route through a proxy or a regional
      # endpoint. There is no fixed-reading fallback: without a key, startup stops.
      base-url: ${GEMINI_BASE_URL:}
      # Never a literal here — this file is committed and the repo is public. Set GEMINI_API_KEY,
      # or put the key in the gitignored application-local.properties.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}
  mail:
    from: ${MAIL_FROM:no-reply@wesee.my}
  app:
    base-url: ${APP_BASE_URL:http://localhost:4210}
