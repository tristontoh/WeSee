spring:
  application:
    name: esg-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wesee:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890-abcdef}
    expiration-minutes: 1440
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  uploads:
    dir: ${UPLOADS_DIR:./data/uploads}
  mail:
    from: ${MAIL_FROM:no-reply@wesee.my}
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}
