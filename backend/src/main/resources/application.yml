spring:
  application:
    name: esg-backend
  profiles:
    # local last so it wins: it holds credentials that must not be committed, and Spring
    # tolerates the file being absent — a fresh clone starts without one.
    active: dev,local
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wesee:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890-abcdef}
    expiration-minutes: 1440
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4210}
  uploads:
    dir: ${UPLOADS_DIR:./data/uploads}
  extraction:
    # gemini reads real documents; stub proposes a fixed reading and is what the test profile
    # pins. There is no automatic fallback between them — selecting gemini without a key stops
    # startup, because invented figures must never stand in for read ones.
    provider: ${EXTRACTION_PROVIDER:gemini}
    gemini:
      # Never a literal here — this file is committed and the repo is public. Set GEMINI_API_KEY,
      # or put the key in the gitignored application-local.properties.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}
  mail:
    from: ${MAIL_FROM:no-reply@wesee.my}
  app:
    base-url: ${APP_BASE_URL:http://localhost:4210}
