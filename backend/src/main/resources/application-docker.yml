# Compose. This is a deployment profile, not a development one — JwtSecretGuard treats it as
# production, and so should you.
#
# Everything but the database host comes from application.yml, which requires DB_NAME,
# DB_USERNAME and DB_PASSWORD to be set rather than defaulting them. They used to default to
# "wesee"/"wesee" here, which is the same defect the published JWT key was.
spring:
  datasource:
    # "db" is the compose service name, which is a useful default because it is not a credential.
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME}
