services:
  postgres:
    # pgvector, not stock postgres — V78 needs the vector extension. A plain postgres:16 here
    # fails that migration and the backend never starts.
    image: pgvector/pgvector:pg16
    environment:
      # Defaults must match application-dev.yml (DB_USERNAME:postgres / DB_PASSWORD:root)
      # so `make infra && make backend` works with no env vars set.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-wesee_esg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
