<div style="position:relative;display:flex;height:100vh;width:100%;overflow:hidden;background:radial-gradient(120% 110% at 12% 6%,#dbe9f8 0%,transparent 52%),radial-gradient(120% 120% at 90% 8%,#fbe7dd 0%,transparent 52%),radial-gradient(130% 130% at 86% 96%,#dcecd7 0%,transparent 55%),radial-gradient(120% 120% at 6% 98%,#f6e6d4 0%,transparent 52%),radial-gradient(90% 90% at 50% 52%,#ece4f5 0%,transparent 62%),#edeeef;font-size:14px;">

  <app-toast></app-toast>

  <!-- ============ SIDEBAR ============ -->
  <aside style="position:relative;z-index:1;width:248px;flex-shrink:0;background:rgba(255,255,255,.55);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);border-right:1px solid rgba(255,255,255,.6);color:#4A5A52;display:flex;flex-direction:column;height:100%;">
    <div style="padding:22px 20px 16px;display:flex;align-items:center;gap:11px;">
      <div style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <img src="assets/wesee-logo.png" alt="WeSee" style="width:30px;height:30px;object-fit:contain;">
      </div>
      <div>
        <div style="font-size:16px;font-weight:600;letter-spacing:-.3px;color:#1B2B24;line-height:1;">WeSee</div>
        <div style="font-size:10.5px;color:#8FA79B;letter-spacing:.5px;margin-top:3px;">CARBON ASSURANCE</div>
      </div>
    </div>

    <!-- Current workspace. Read-only: which nav you see is derived from your role and
         subscription plan, so there is nothing valid to switch to. -->
    <div style="padding:6px 16px 14px;">
      <div style="font-size:10px;letter-spacing:.8px;color:#93A099;margin:6px 4px 9px;font-weight:600;">WORKSPACE</div>
      <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.5);border-radius:13px;padding:10px 12px;">
        <span style="font-size:12px;font-weight:700;color:#1A2420;">{{ state.meta().label }}</span>
      </div>
      <div style="font-size:11px;color:#93A099;margin:10px 4px 0;line-height:1.4;">{{ state.companyName() }}</div>
    </div>

    <div style="height:1px;background:rgba(70,90,120,.12);margin:2px 16px 10px;"></div>

    <!-- nav -->
    <nav style="flex:1;overflow-y:auto;padding:0 12px;">
      <!-- A locked item is one the backend marks visibleOnlyAtMinPlan=false: shown on purpose,
           but above this company's plan. It stays clickable so the screen can explain why. -->
      <button *ngFor="let item of state.navItems()" (click)="go(item.path)" class="nav-item" [class.nav-item--active]="isActive(item.path)"
        [attr.data-locked]="state.isLocked(item) ? 'true' : null" [style.opacity]="state.isLocked(item) ? 0.55 : 1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" [attr.stroke]="isActive(item.path) ? '#EAF7F0' : '#5E7368'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path [attr.d]="item.d"></path></svg>
        <span style="flex:1;text-align:left;">{{ item.label }}</span>
        <svg *ngIf="state.isLocked(item)" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#93A099" stroke-width="2" style="flex-shrink:0;" [attr.aria-label]="'Requires a higher plan'"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      </button>
    </nav>

    <!-- profile footer -->
    <div style="padding:14px 16px 18px;border-top:1px solid rgba(70,90,120,.12);position:relative;">
      <button (click)="ui.toggleProfile()" class="hover-soft" style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:8px 10px;width:100%;box-sizing:border-box;box-shadow:0 4px 12px rgba(70,90,120,.08);cursor:pointer;font-family:inherit;">
        <div style="width:32px;height:32px;border-radius:50%;background:#629BB5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;flex-shrink:0;">{{ state.user().initials }}</div>
        <div style="flex:1;min-width:0;text-align:left;">
          <div style="font-size:12.5px;font-weight:600;color:#1B2B24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ state.user().name }}</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64726B" stroke-width="2" style="flex-shrink:0;"><path d="M6 9l6 6 6-6"></path></svg>
      </button>

      <ng-container *ngIf="ui.profileOpen()">
        <div (click)="ui.closeProfile()" style="position:fixed;inset:0;z-index:55;"></div>
        <div style="position:absolute;bottom:78px;left:16px;right:16px;background:#ffffff;border:1px solid rgba(0,0,0,.1);border-radius:14px;box-shadow:0 20px 50px rgba(5,8,30,.22);padding:8px;z-index:60;animation:vfade .16s ease both;">
          <div style="padding:10px 12px 12px;">
            <div style="font-size:13.5px;font-weight:600;">{{ state.user().name }}</div>
            <div style="font-size:11.5px;color:#8A968F;">{{ state.user().email }}</div>
          </div>
          <div style="height:1px;background:rgba(0,0,0,.08);margin:0 8px 8px;"></div>
          <button (click)="openSettings()" class="hover-panel" style="width:100%;display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;padding:10px 12px;border-radius:9px;font-size:13px;color:#33413A;text-align:left;font-family:inherit;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5A52" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.2.63.79 1 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>Settings
          </button>
          <button (click)="signOut()" class="hover-panel" style="width:100%;display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;padding:10px 12px;border-radius:9px;font-size:13px;color:#4054C3;text-align:left;font-family:inherit;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Sign out
          </button>
        </div>
      </ng-container>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;height:100%;min-width:0;background:transparent;">

    <!-- topbar -->
    <header style="height:60px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.32);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:10;">
      <div style="display:flex;align-items:center;gap:9px;font-size:13px;color:#64726B;">
        <span>{{ state.meta().label }}</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4BEB7" stroke-width="2"><path d="M9 6l6 6-6 6"></path></svg>
        <span style="color:#1A2420;font-weight:600;">{{ state.screenTitle() }}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="search-box" style="position:relative;">
          <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.5);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.55);border-radius:9px;padding:7px 12px;width:230px;color:#93A099;font-size:13px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93A099" stroke-width="2" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
            <input [value]="ui.searchQuery()" (input)="onSearchInput($event)" (focus)="ui.focusSearch()" placeholder="Search…" style="border:none;background:none;outline:none;font-size:13px;color:#33413A;width:100%;font-family:inherit;">
          </div>
          <ng-container *ngIf="ui.searchOpen()">
            <div (click)="ui.closeSearch()" style="position:fixed;inset:0;z-index:55;"></div>
            <div style="position:absolute;top:44px;left:0;width:100%;background:#ffffff;border:1px solid rgba(0,0,0,.1);border-radius:12px;box-shadow:0 20px 50px rgba(5,8,30,.22);padding:6px;z-index:60;animation:vfade .16s ease both;">
              <ng-container *ngIf="searchResults().length; else noResultsTpl">
                <button *ngFor="let r of searchResults()" (click)="goSearchResult(r.path)" class="hover-panel" style="width:100%;display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;padding:9px 10px;border-radius:8px;font-size:13px;color:#33413A;text-align:left;font-family:inherit;">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A5A52" stroke-width="1.7" style="flex-shrink:0;"><path [attr.d]="r.d"></path></svg>{{ r.label }}
                </button>
              </ng-container>
              <ng-template #noResultsTpl>
                <div *ngIf="searchNoResults()" style="padding:12px 10px;font-size:12.5px;color:#8A968F;">No pages match "{{ ui.searchQuery() }}"</div>
              </ng-template>
            </div>
          </ng-container>
        </div>
      </div>
    </header>

    <!-- page scroll area -->
    <main style="flex:1;overflow-y:auto;">
      <div class="page-shell" style="max-width:1180px;margin:0 auto;padding:30px 30px 70px;">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <app-evidence-drawer></app-evidence-drawer>
  <app-change-password-modal></app-change-password-modal>
  <app-confirm-dialog></app-confirm-dialog>

</div>
